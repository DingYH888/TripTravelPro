services:
  travel-nginx:
    image: nginx:latest
    container_name: travel-nginx
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../travel-web/apps/front/dist:/usr/share/nginx/html-root/front:ro
      - ../../travel-web/apps/admin/dist:/usr/share/nginx/html-root/admin:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
