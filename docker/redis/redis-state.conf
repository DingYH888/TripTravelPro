# travel redis state instance (port 6380)
# purpose: jwt blacklist / refresh token / locks / rate limit / captcha
# NOTE: never evict these keys
bind 0.0.0.0
# host port is published to 127.0.0.1 only, so protected-mode can be off
protected-mode no
port 6380

# state must survive restart
appendonly yes
appendfsync everysec
save 900 1
save 300 10

# 128MB for local dev, noeviction to protect locks and sessions
maxmemory 128mb
maxmemory-policy noeviction

timeout 0
tcp-keepalive 300
loglevel notice
databases 16
