# travel redis cache instance (port 6379)
# purpose: hot data cache, safe to evict
bind 0.0.0.0
# host port is published to 127.0.0.1 only, so protected-mode can be off
protected-mode no
port 6379

# cache can be lost on restart
appendonly no
save ""

# 256MB for local dev, allkeys-lru
maxmemory 256mb
maxmemory-policy allkeys-lru

timeout 0
tcp-keepalive 300
loglevel notice
databases 16
