# ??
server:
  port: ${SERVER_PORT:8080}


# ???
spring:
  # 本地敏感配置（JWT_SECRET 等），文件不入库
  config:
    import: optional:file:./.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql:///travel?serverTimezone=UTC
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travel}?serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  #上传文件
  servlet:
    multipart:
      max-file-size: 10MB # 最大单个文件
      max-request-size: 10MB # 一次请求最大上传
    # 打成jar包必须添加如下配置才能找到页面
  thymeleaf:
    mode: HTML
    cache: false
    prefix: classpath:/templates


#??mybatis-plus
mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #??sql??


# ????
logging:
  pattern:
    console: '%d{HH:mm:ss.SSS} %clr(%-5level) ---  [%-15thread] [%X{traceId:-}] %cyan(%-50logger{50}):%msg%n'

# 发送邮件配置
mail:
  # 发件人地址
  user: ${MAIL_USER:2728093475@qq.com}
  # 发件人密码
  password: ${MAIL_PASSWORD:rciidjejecwadcdf}
# 项目路径
project:
  path: ${PROJECT_PATH:http://localhost:8080}
# 上传文件存储目录（默认项目运行目录下的 upload 文件夹）
upload:
  path: ${UPLOAD_PATH:${user.dir}/upload}

# 新增：Redis 双实例（cache 可淘汰 / state 不可淘汰）
travel:
  redis:
    cache:
      host: ${REDIS_CACHE_HOST:127.0.0.1}
      port: ${REDIS_CACHE_PORT:6379}
      database: ${REDIS_CACHE_DB:0}
      password: ${REDIS_CACHE_PASSWORD:}
      timeout: 2s
      max-total: 32
      max-idle: 8
      min-idle: 2
    state:
      host: ${REDIS_STATE_HOST:127.0.0.1}
      port: ${REDIS_STATE_PORT:6380}
      database: ${REDIS_STATE_DB:0}
      password: ${REDIS_STATE_PASSWORD:}
      timeout: 2s
      max-total: 32
      max-idle: 8
      min-idle: 2
  jwt:
    issuer: travel
    secret: ${JWT_SECRET:change-me-in-local-env-file-please-32bytes}
    admin-access-ttl: 2h
    member-access-ttl: 7d
    refresh-ttl: 14d

# Actuator：仅暴露健康与信息
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

